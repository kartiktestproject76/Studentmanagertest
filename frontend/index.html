 #bn{display:none}body{padding-bottom:30px}

let students=[],att={},mk={},tpl={},pg='att',cls='',q='',date=new Date().toISOString().slice(0,10),exam=ls.g('exam')||'',total=ls.g('total')||'100';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function busy(d){pend+=d;clearTimeout(t1);clearTimeout(t2);const el=$('#ld');
 if(pend>0){t1=setTimeout(()=>{el.className='on'},500);t2=setTimeout(()=>{el.className='on slow'},7000)}else el.className=''}
async function api(path,o={}){busy(1);try{return await api0(path,o)}finally{busy(-1)}}
async function api0(path,o={}){
 const r=await fetch(API+'/api'+path,{method:o.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(auth?auth.token:'')},body:o.body?JSON.stringify(o.body):undefined});
 if(r.status===401&&!path.startsWith('/auth/')){logout(true,'Your session ended. Please log in again.');throw new Error('Please log in again.')}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
const classes=()=>[...new Set(students.map(s=>s.cls))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
const list=()=>students.filter(s=>(!cls||s.cls===cls)&&(!q||s.name.toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>a.cls.localeCompare(b.cls,undefined,{numeric:true})||(+a.roll||0)-(+b.roll||0)||a.name.localeCompare(b.name));

 }catch(e){if(my===rid)$('#m').innerHTML='<div class="empty">'+esc(e.message)+'<br><button class="ghost" id="retry" style="margin-top:12px">Try again</button></div>'}

function parseCsv(t){const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;
  else if(ch===','||ch===';'||ch==='\t'){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
  else c+=ch}
 if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
async function importXl(f){
 try{
  if(f.size>2*1024*1024)throw new Error('The file is too big (maximum 2 MB).');
  const nm=f.name.toLowerCase();let rows;
  if(nm.endsWith('.csv'))rows=parseCsv((await f.text()).replace(/^\uFEFF/,''));
  else if(nm.endsWith('.xlsx')){const res=await readXlsxFile(f);rows=Array.isArray(res)&&res[0]&&res[0].data?res[0].data:res}
  else throw new Error('Please use an .xlsx or .csv file. For an old .xls file, open it and use Save As .xlsx.');
  if(!rows||rows.length<2)throw new Error('The file has no student rows.');
  const head=rows[0].map(x=>String(x==null?'':x).trim().toLowerCase());
  const objs=rows.slice(1,2001).map(r=>Object.fromEntries(head.map((h,i)=>[h||('c'+i),String(r[i]==null?'':r[i]).trim()])));
  const g=(o,re)=>{const k=Object.keys(o).find(k=>re.test(k));return k?o[k]:''};
  const out=objs.map(o=>({name:g(o,/name/),cls:g(o,/class|std|standard|grade/),roll:g(o,/roll/),phone:g(o,/whatsapp|phone|mobile|contact/),email:g(o,/mail/)}));
  const r=await api('/students/bulk',{method:'POST',body:{rows:out}});await reloadStudents();
  alert(r.count+' students imported.'+(r.skipped?' '+r.skipped+' rows or emails were skipped (invalid or already used).':''));drawStu();
 }catch(err){alert('Could not import: '+err.message)}
}

const NL=s=>/[^\u0000-\u024f]/.test(String(s));
function txtImg(s,px){const c=document.createElement('canvas'),x=c.getContext('2d'),f=(px*3)+'px Inter, system-ui, sans-serif';x.font=f;
 const w=Math.ceil(x.measureText(s).width)+8;c.width=w;c.height=Math.ceil(px*3*1.5);x.font=f;x.fillStyle='#111';x.textBaseline='middle';x.fillText(s,4,c.height/2);return{url:c.toDataURL('image/png'),w:w/3,h:c.height/3}}
function put(doc,s,x,y,px,bold){if(NL(s)){const i=txtImg(s,px);doc.addImage(i.url,'PNG',x,y-px*1.05,i.w,i.h);return i.w}
 doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(px);doc.text(String(s),x,y);return doc.getTextWidth(String(s))}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pc=(a,b)=>b?(Math.round(a*1000/b)/10)+'%':'-';
const dmy=d=>d.split('-').reverse().join('-');
function makePdf(r,type){
 const {jsPDF}=window.jspdf;if(!jsPDF){alert('PDF library did not load. Check your internet and try again.');return}
 const doc=new jsPDF({unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth(),mx=40;
 const [yy,mm]=r.month.split('-').map(Number),label=MONTHS[mm-1]+' '+yy;
 const head={fillColor:[70,60,200],textColor:255,fontStyle:'bold'};
 const nameHook={didParseCell:d=>{if(d.section==='body'&&d.column.dataKey==='name'&&NL(d.cell.raw)){d.cell.nm=String(d.cell.raw);d.cell.text=['']}},
  didDrawCell:d=>{if(d.cell.nm){const i=txtImg(d.cell.nm,9);doc.addImage(i.url,'PNG',d.cell.x+4,d.cell.y+(d.cell.height-i.h)/2,i.w,i.h)}}};
 const S=r.students.sort((a,b)=>(+a.roll||0)-(+b.roll||0)||a.name.localeCompare(b.name));
 const att=id=>r.attendance.filter(a=>a.student_id===id).sort((a,b)=>a.date.localeCompare(b.date));
 const mks=id=>r.marks.filter(x=>x.student_id===id);
 doc.setFillColor(70,60,200);doc.rect(0,0,W,70,'F');doc.setTextColor(255);
 put(doc,type==='student'?'Monthly Student Report':'Monthly Standard Report',mx,34,20,true);put(doc,label,mx,56,12,false);doc.setTextColor(20);
 let fname;
 if(type==='student'){
  const s=S[0];if(!s){alert('Student not found.');return}
  const A=att(s.id),P=A.filter(a=>a.status==='P').length,Ab=A.length-P,M=mks(s.id);
  let y=104;const w=put(doc,s.name,mx,y,16,true);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  doc.text(`Standard: ${NL(s.cls)?'':s.cls}    Roll no.: ${s.roll||'-'}    WhatsApp: ${s.phone||'-'}`,mx,y+18);doc.setTextColor(20);
  y+=44;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Attendance',mx,y);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text(`Present: ${P}    Absent: ${Ab}    Days marked: ${A.length}    Attendance: ${pc(P,A.length)}`,mx,y+16);
  if(A.length)doc.autoTable({startY:y+26,margin:{left:mx,right:mx},head:[['Date','Day','Status']],body:A.map(a=>[dmy(a.date),new Date(a.date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long'}),a.status==='P'?'Present':'Absent']),headStyles:head,styles:{fontSize:9},
   didParseCell:d=>{if(d.section==='body'&&d.column.index===2)d.cell.styles.textColor=d.cell.raw==='Present'?[20,140,70]:[200,40,60]}});
  else{doc.setTextColor(120);doc.text('No attendance recorded in this month.',mx,y+40);doc.setTextColor(20)}
  y=(A.length?doc.lastAutoTable.finalY:y+40)+28;
  if(y>740){doc.addPage();y=60}
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Marks',mx,y);
  if(M.length){const so=M.reduce((a,x)=>a+Number(x.marks),0),st=M.reduce((a,x)=>a+Number(x.total),0);
   doc.autoTable({startY:y+10,margin:{left:mx,right:mx},head:[['Exam / Subject','Marks','Total','Percentage']],body:M.map(x=>[x.exam||'-',x.marks,x.total,pc(Number(x.marks),Number(x.total))]),foot:[['Overall',so,st,pc(so,st)]],headStyles:head,footStyles:{fillColor:[235,232,255],textColor:20,fontStyle:'bold'},styles:{fontSize:9}})}
  else{doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(120);doc.text('No marks recorded in this month.',mx,y+18)}
  fname='Report_'+(NL(s.name)?'student':s.name.replace(/[^\w]+/g,'_'))+'_'+r.month+'.pdf';
 }else{
  const std=S[0]?S[0].cls:'';
  put(doc,'Standard: '+std,mx,104,16,true);
  const rows=S.map(s=>{const A=att(s.id),P=A.filter(a=>a.status==='P').length,M=mks(s.id),so=M.reduce((a,x)=>a+Number(x.marks),0),st=M.reduce((a,x)=>a+Number(x.total),0);
   return{roll:s.roll||'-',name:s.name,p:P,a:A.length-P,ap:pc(P,A.length),m:M.length?so+'/'+st:'-',mp:M.length?pc(so,st):'-',P,n:A.length,so,st}});
  const tp=rows.reduce((a,x)=>a+x.P,0),tn=rows.reduce((a,x)=>a+x.n,0),tso=rows.reduce((a,x)=>a+x.so,0),tst=rows.reduce((a,x)=>a+x.st,0);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  doc.text(`Students: ${S.length}    Average attendance: ${pc(tp,tn)}    Average marks: ${pc(tso,tst)}`,mx,122);doc.setTextColor(20);
  doc.autoTable({startY:136,margin:{left:mx,right:mx},columns:[{header:'Roll',dataKey:'roll'},{header:'Name',dataKey:'name'},{header:'Present',dataKey:'p'},{header:'Absent',dataKey:'a'},{header:'Attendance',dataKey:'ap'},{header:'Marks',dataKey:'m'},{header:'Marks %',dataKey:'mp'}],body:rows,headStyles:head,styles:{fontSize:9},...nameHook});
  const ex=[...new Set(r.marks.map(x=>x.exam||'-'))];
  if(ex.length){let y=doc.lastAutoTable.finalY+28;if(y>720){doc.addPage();y=60}
   doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Exam-wise marks',mx,y);
   const cols=[{header:'Name',dataKey:'name'},...ex.map((e,i)=>({header:e,dataKey:'e'+i}))];
   const body=S.map(s=>{const o={name:s.name};ex.forEach((e,i)=>{const x=mks(s.id).find(z=>(z.exam||'-')===e);o['e'+i]=x?x.marks+'/'+x.total:'-'});return o});
   doc.autoTable({startY:y+10,margin:{left:mx,right:mx},columns:cols,body,headStyles:head,styles:{fontSize:8},horizontalPageBreak:true,horizontalPageBreakRepeat:0,...nameHook})}
  fname='Report_Standard_'+std.replace(/[^\w]+/g,'_')+'_'+r.month+'.pdf';
 }
 const n=doc.getNumberOfPages(),H=doc.internal.pageSize.getHeight(),now=new Date();
 for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(130);
  doc.text(`Generated on ${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()}`,mx,H-20);doc.text(`Page ${i} of ${n}`,W-mx,H-20,{align:'right'})}
 doc.save(fname);
}
async function runQueue(){
 const type=pg==='att'?'attendance':'marks';
 const all=await api('/queue',{method:'POST',body:type==='attendance'?{type,date,cls}:{type,exam,cls}});
 const items=all.filter(x=>x.link),skipped=all.length-items.length;
 if(!items.length){alert(all.length?'No student has a WhatsApp number.':'Nothing left to send.');return}
 let i=0;
 const show=()=>{
  if(i>=items.length){$('#dlg').close();alert('Done. '+items.length+' chats opened.'+(skipped?' '+skipped+' skipped (no number).':''));render();return}
  const it=items[i];
  $('#dlg').innerHTML=`<div class="dh"><div><h2>${i+1} of ${items.length}</h2><p>${esc(it.name)}, ${esc(it.cls)}</p></div></div><button id="qn" class="cta" style="width:100%;margin-bottom:10px">${ico('send')}Open WhatsApp</button><div class="dbtns" style="margin-top:0"><button class="ghost" id="qs">Skip</button><button class="ghost" id="qx">Stop</button></div><small style="margin-top:10px">Tap Send in WhatsApp, then come back here for the next student.</small>`;
  $('#qn').onclick=()=>{window.open(it.link,'_blank','noopener');api('/mark-sent',{method:'POST',body:{type,student_id:it.student_id,date,exam}}).catch(()=>{});i++;show()};
  $('#qs').onclick=()=>{i++;show()};$('#qx').onclick=()=>{$('#dlg').close();render()};
 };
 $('#dlg').showModal();show();
}
const m=$('#m');let tm={};
m.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){q=t.value;pg==='att'?drawAtt():pg==='mk'?drawMk():drawStu()}
 if(t.id==='ex'){exam=t.value;ls.s('exam',exam);clearTimeout(tm.e);tm.e=setTimeout(()=>{useMk();drawMk();loadMk().catch(()=>{})},400)}
 if(t.id==='tot'){total=t.value;ls.s('total',total)}
 const r=t.closest('.mk');if(r&&pg==='mk'&&t.type==='number'&&t.id!=='tot'){
  const id=r.dataset.id;r.querySelector('[data-msend]').style.display=t.value===''?'none':'';
  clearTimeout(tm[id]);tm[id]=setTimeout(()=>api('/marks',{method:'PUT',body:{student_id:id,exam,marks:t.value,total}}).then(()=>{mk[id]=t.value===''?undefined:{marks:t.value,total,sent:false}}).catch(x=>alert(x.message)),500)}});
m.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='cls'){cls=t.value;pg==='att'?drawAtt():drawMk()}
 if(t.id==='dt'&&t.value){date=t.value;useAtt();drawAtt();loadAtt().catch(()=>{})}
 if(t.id==='xl'&&t.files[0])importXl(t.files[0]);
 if(t.id==='rsel')rsel=t.value;
 if(t.id==='fcls'){fcls=t.value;fprev=null;fileBtn();loadPrev()}
 if(t.id==='ffile')pickFile(t.files[0]);
 if(t.id==='rmon'&&t.value)rmon=t.value;
 if(t.id==='memon'&&t.value){memon=t.value;drawMe()}});
m.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
 try{
 if(t.id==='retry'){render();return}
 if(t.id==='fsend'){await sendFile(t);return}
 if(t.dataset.st){setAtt(t.closest('.row').dataset.id,t.dataset.st);return}
if(t.id==='uadd'){await api('/users',{method:'POST',body:{email:$('#ue').value.trim(),name:$('#un').value.trim(),role:$('#ur').value}});await drawUsr();return}
 if(t.dataset.udel){if(confirm('Remove this user? They will be logged out.')){await api('/users/'+encodeURIComponent(t.dataset.udel),{method:'DELETE'});await drawUsr()}return}
 if(t.dataset.rt){rt=t.dataset.rt;rsel='';drawStu();return}
 if(t.id==='rpt'){const byName=[...students].sort((a,b)=>a.name.localeCompare(b.name)),sel=rsel||(rt==='student'?(byName[0]||{}).id:classes()[0]);
  if(!sel){alert('Add students first.');return}if(!rmon){alert('Choose a month.');return}
  t.disabled=true;try{const r=await api('/report?month='+rmon+(rt==='student'?'&student_id=':'&cls=')+encodeURIComponent(sel));makePdf(r,rt)}finally{t.disabled=false}return}
 if(t.id==='add'){const name=$('#n').value.trim();if(!name){alert('Enter the student name.');return}
  await api('/students',{method:'POST',body:{name,cls:$('#c').value.trim(),roll:$('#r').value.trim(),phone:$('#ph').value.trim(),email:$('#em').value.trim()}});await reloadStudents();drawStu()}
 if(t.dataset.edit){editStu(t.dataset.edit)}
 if(t.dataset.del&&confirm('Remove this student and their records?')){await api('/students/'+t.dataset.del,{method:'DELETE'});await reloadStudents();drawStu()}
 if(t.dataset.send){const id=t.dataset.send;doSend(t,{type:'attendance',student_id:id,date},()=>{if(att[id])att[id].sent=true})}
 if(t.dataset.msend){const id=t.dataset.msend,v=t.parentNode.querySelector('input').value;
  if(!exam.trim()){alert('Enter the exam or subject name first.');return}
  clearTimeout(tm[id]);await api('/marks',{method:'PUT',body:{student_id:id,exam,marks:v,total}});
  doSend(t,{type:'marks',student_id:id,exam},()=>{mk[id]={marks:v,total,sent:true}})}
 if(t.id==='all'){if(pg==='mk'&&!exam.trim()){alert('Enter the exam or subject name first.');return}
  t.disabled=true;t.textContent='Sending…';
  const r=await api('/send-all',{method:'POST',body:pg==='att'?{type:'attendance',date,cls}:{type:'marks',exam,cls}});
  if(r.notConfigured){t.disabled=false;t.innerHTML=SENDALL;await runQueue();return}
  if(!r.queued){alert('Nothing to send.');t.disabled=false;t.innerHTML=SENDALL;return}
  const iv=setInterval(async()=>{try{const j=await api('/send-status');t.textContent=`Sending ${j.sent+j.failed}/${j.total}…`;
   if(!j.running){clearInterval(iv);alert(`Sent ${j.sent}, failed ${j.failed}.`+(j.lastError?'\n'+j.lastError:''));render()}}catch(x){clearInterval(iv);alert(x.message);render()}},3000)}
 if(t.id==='wao'&&confirm('Disconnect WhatsApp from this app?')){await api('/wa/logout',{method:'POST'});loadWa()}
 }catch(err){alert(err.message);t.disabled=false}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){pg=b.dataset.p;q='';cls='';render()}});
const MSG={present:['Present Message','Customize the message for present students','present',['name','class','date']],absent:['Absent Message','Customize the message for absent students','absent',['name','class','date']],marks:['Marks Message','Customize the message for marks','markico',['name','class','marks','total','exam']]};
$('#msgb').onclick=()=>{
 if(!tpl.present){alert('Still loading. Try again in a moment.');return}
 const f=pg==='att'?['present','absent']:pg==='mk'?['marks']:['present','absent','marks'];
 $('#dlg').innerHTML=`<button class="x" id="cx">${ico('x')}</button>`+f.map(k=>{const [t,s,im,v]=MSG[k];
  return `<div class="mpanel"><img class="mico" src="${IMG[im]}" alt=""><div class="mbody"><h3>${t}</h3><p>${s}</p><textarea data-k="${k}">${esc(tpl[k].body)}</textarea><div class="vars">${ico('send')}Variables: ${v.map(x=>`<button class="chip" data-var="{${x}}">{${x}}</button>`).join('')}</div>${waM==='baileys'?'':`<label class="l">Approved WhatsApp template name</label><label class="fi"><input data-t="${k}" value="${esc(tpl[k].wa_template)}"></label>`}</div></div>`}).join('')
  +`<small>${waM==='baileys'?'This exact text is sent.':'Text sent through the WhatsApp API comes from the approved Meta template with the same variables.'}</small><div class="dbtns"><button class="ghost" id="cx2">${ico('x')}Cancel</button><button class="cta" id="sv">${ico('save')}Save Message</button></div>`;
 $('#dlg').onclick=e=>{const c=e.target.closest('[data-var]');if(!c)return;const ta=c.closest('.mpanel').querySelector('textarea');const p=ta.selectionStart==null?ta.value.length:ta.selectionStart;ta.setRangeText(c.dataset.var,p,ta.selectionEnd==null?p:ta.selectionEnd,'end');ta.focus()};
 $('#dlg').showModal();$('#cx').onclick=$('#cx2').onclick=()=>$('#dlg').close();
 $('#sv').onclick=async()=>{try{for(const k of f){const body=document.querySelector(`#dlg [data-k="${k}"]`).value,wi=document.querySelector(`#dlg [data-t="${k}"]`),wa=wi?wi.value.trim():tpl[k].wa_template;
  await api('/templates/'+k,{method:'PUT',body:{body,wa_template:wa,wa_lang:tpl[k].wa_lang}});tpl[k].body=body;tpl[k].wa_template=wa}$('#dlg').close()}catch(e){alert(e.message)}};
};
async function startApp(){
 document.body.classList.remove('lo');pg=role()==='student'?'me':'att';q='';cls='';
 if(role()==='student'){chrome();await render();return}
 let had=false;
 try{const c=JSON.parse(ls.g('sm-cache')||'null');if(c&&c.students){students=c.students;tpl=c.tpl||{};waM=c.waM||'';had=true;render()}}catch(e){}
 if(!had){chrome();$('#m').innerHTML='<div class="empty">Loading…</div>'}
 try{const b=await api('/bootstrap'),o=JSON.stringify([students,tpl,waM]);students=b.students;tpl=Object.fromEntries(b.templates.map(t=>[t.key,t]));waM=b.mode;saveCache();if(!had||o!==JSON.stringify([students,tpl,waM]))render()}
 catch(e){if(!had){chrome();$('#m').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
}
if(auth)startApp();else showLogin();
</script></body></html>
